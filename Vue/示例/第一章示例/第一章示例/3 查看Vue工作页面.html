<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>理解MVVM</title>
        <script src="./vue.js"></script>
    </head>
    <body>
        <div id="root">
            <h1>学校名称：{{name}}</h1>
            <h1>学校地址：{{address}}</h1> 
        </div>
    </body>

    <script type="text/javascript">
    Vue.config.productionTip = false
       
    let vm = new Vue({
        el: '#root', 
        data: {     
            name: '',
            address: ''
        }                        
    })

    </script>
</html>
