<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>初识Vue</title>
   <!--引入Vue -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>
   <!--准备一个容器 -->
    <div id="root">
      <h1>Hello,{{name}}</h1>
   </div>

   <script >
      new Vue({
        el:'#root',  //el用于指定当前Vue实例为哪个容器服务，值通常为CSS选择器字符串,tip:多组key value之间用，分隔
       // data:'天工大'
       data:{   //data中用于存储数据，数据供el所指定的容器使用，指我们暂且先写为一个对象
        name:'网络安全'
       }
      })
   </script>
</body>
</html>
