<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>回顾Object.definepropty方法</title>
   <!--引入Vue -->
  <!-- <script src="vue.js"></script> -->
</head>
<body>
   <script type="text/javascript">
       
       let person = {
         name:'张三',
         sex:'男',
         
       }
   Object.defineProperty(person,'age',{
    value:18,
    enumerable:true, //控制属性是否可以枚举，默认False
    writable:true,   //控制属性是否可以被修改，默认F
    configurable:true, //控制属性是否可以被删除，默认F
   })
    
    console.log(Object.keys(person))
    console.log(person)
   </script>
   
</body>
</html>
