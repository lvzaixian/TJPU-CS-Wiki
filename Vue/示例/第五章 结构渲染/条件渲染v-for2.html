<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>列表渲染</title>
   <!--引入Vue -->
  <script src="../vue.js"></script>
</head>
<body>
   <!--准备一个容器 -->
    <div id="root">
      <div v-for="item in list" :key="item.id">
        id是:{{ item.id }} --- 元素的内容是:{{ item.message }}
      </div>
    </div>
   
   <script >
     new Vue({
        el:'#root',  
        data:{ 
         list: [
         { id: 1, message: '梅', }, { id: 2, message: '兰', },
         { id: 3, message: '竹', }, { id: 4, message: '菊', }
         ]
       }
     })
   </script>
</body>
</html>
