<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>列表渲染</title>
   <!--引入Vue -->
  <script src="../vue.js"></script>
</head>
<body>
   <!--准备一个容器 -->
    <div id="root">
      <div v-for="(value, name) in user" :key="name">
          属性名是：{{ name }} --- 属性值是：{{ value }}
      </div>
    </div>
   
   <script >
     new Vue({
        el:'#root',  
        data:{ 
         user: { 
          id: 11, name: '小明', gender: '男' 
        }
       }
     })
   </script>
</body>
</html>
