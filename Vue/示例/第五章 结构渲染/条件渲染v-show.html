<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>事件处理</title>
   <!--引入Vue -->
  <script src="../vue.js"></script>
</head>
<body>
   <!--准备一个容器 -->
    <div id="root">
      <p v-if="flag">通过v-if控制的元素</p>
      <p v-show="flag">通过v-show控制的元素</p>
      <button @click="flag = !flag">显示/隐藏</button>
    </div>
   
   <script >
     new Vue({
        el:'#root',  
        data:{ 
        flag:true
       }
     })
   </script>
</body>
</html>
