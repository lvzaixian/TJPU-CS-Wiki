<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>事件处理</title>
   <!--引入Vue -->
  <script src="vue.js"></script>
</head>
<body>
   <!--准备一个容器 -->
    <div id="root">
      <h3>欢迎来到{{name}}</h3>
      <hr/>
      <button @click="showInfo1">点我提示1</button>
      <button @click="showInfo2($event,66)">点我提示2</button>
      </div>

   <script >
     const vm= new Vue({
        el:'#root',  
        data:{ 
        name:'天工大'
       },
       methods: {
         showInfo1(event){
            alert('同学你好！')
         },
         showInfo2(event,number){
            console.log(event,number)
            alert('同学你好！！')
         }
       }
      })
   </script>
</body>
</html>
