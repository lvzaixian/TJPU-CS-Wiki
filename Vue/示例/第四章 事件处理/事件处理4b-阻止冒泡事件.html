<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>事件处理</title>
   <!--引入Vue -->
  <script src="vue.js"></script>
</head>
<body>
   <!--准备一个容器 -->
    <div id="root">
      <h3>欢迎来到{{name}}</h3>
      <hr/>
      <div @click="showInfo">
      <button v-on:click.stop="showInfo">点我提示</button>
      </div>
   </div>

   <script >
     const vm= new Vue({
        el:'#root',  
        data:{ 
        name:'天工大'
       },
       methods: {
         showInfo(){
            alert('同学你好！')
         }
       },
      })
   </script>
</body>
</html>
