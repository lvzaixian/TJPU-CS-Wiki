<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库期末试卷</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 25px 0;
            margin-bottom: 30px;

            color: white;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        
        h1 {

            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;

        }

            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

            color: white;
            border: none;

        }
        
        .exam-section:hover {

        }

            color: #2c3e50;
            margin-bottom: 25px;
            padding-bottom: 15px;

        }

            color: #3498db;
            background: #e1f0fa;
            padding: 10px;
            border-radius: 50%;
        }
        
        .question-block {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
            position: relative;
        }
        
        .question-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .question-number {
            position: absolute;
            top: -12px;
            left: -12px;
            background: #3498db;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .options {
            display: grid;
            gap: 10px;
        }
        
        .option {
            padding: 12px 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .option:hover {
            border-color: #3498db;
            background: #e1f0fa;
        }
        
        .option.selected {
            background: #d1e7ff;
            border-color: #3498db;
            font-weight: 500;
        }
        
        .fill-blank {
            display: inline-block;
            margin: 0 5px;
        }
        
        .fill-input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            min-width: 120px;
            font-size: 1rem;
        }
        
        .fill-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .true-false {
            display: flex;
            gap: 15px;
        }
        
        .tf-option {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tf-option:hover {
            border-color: #3498db;
            background: #e1f0fa;
        }
        
        .tf-option.selected {
            background: #d1e7ff;
            border-color: #3498db;
            font-weight: 500;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .control-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .submit-btn {
            background: #2ecc71;
            color: white;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
        
        .submit-btn:hover {
            background: #27ae60;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
        }
        
        .reset-btn {
            background: #e74c3c;
            color: white;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }
        
        .reset-btn:hover {
            background: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
        }
        
        .answer-btn {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        
        .answer-btn:hover {
            background: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
        }
        
        .answer-area {
            margin-top: 15px;
            padding: 15px;
            background: #e8f4fc;
            border-radius: 8px;
            display: none;
        }
        
        .answer-text {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .explanation {
            margin-top: 10px;
            color: #555;
        }
        
        .score-container {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .score-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .score-value {
            font-size: 3.5rem;
            font-weight: 700;
            color: #3498db;
            margin: 15px 0;
        }
        
        .score-details {
            font-size: 1.1rem;
            color: #555;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .section-title {
                font-size: 1.5rem;
            }
            
            .control-btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
            
            .true-false {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

        // 当前试卷
        let currentExam = 1;
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            renderExam(currentExam);
            
            // 试卷切换按钮事件
            document.querySelectorAll('.exam-btn').forEach(button => {
                button.addEventListener('click', () => {
                    // 更新按钮状态
                    document.querySelectorAll('.exam-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    button.classList.add('active');
                    
                    // 加载新试卷
                    currentExam = parseInt(button.dataset.exam);
                    renderExam(currentExam);
                });
            });
        });
        
        // 渲染试卷
        function renderExam(examNum) {
            const exam = exams[examNum];
            let html = '';
            
            // 选择题部分
            html += `<div class="exam-section">
                <h2 class="section-title"><i class="fas fa-check-circle"></i> 一、单项选择题（每题2分，共20分）</h2>`;
            
            exam.choices.forEach((q, i) => {
                html += `<div class="question-block">
                    <div class="question-number">${i+1}</div>
                    <p class="question-text">${q.question}</p>
                    <div class="options">`;
                
                q.options.forEach((opt, j) => {
                    html += `<div class="option" data-type="choice" data-qindex="${i}" data-option="${j}">${String.fromCharCode(65+j)}. ${opt}</div>`;
                });
                
                html += `</div>
                    <div class="answer-area">
                        <p class="answer-text">正确答案：${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</p>
                        <p class="explanation">解析：${q.explanation}</p>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            
            // 填空题部分
            html += `<div class="exam-section">
                <h2 class="section-title"><i class="fas fa-pencil-alt"></i> 二、填空题（每空1分，共20分）</h2>`;
            
            exam.fills.forEach((q, i) => {
                html += `<div class="question-block">
                    <div class="question-number">${i+1}</div>
                    <p class="question-text">${q.question} <span class="fill-blank"><input type="text" class="fill-input" data-type="fill" data-qindex="${i}"></span></p>
                    <div class="answer-area">
                        <p class="answer-text">正确答案：${q.answer}</p>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            
            // 判断题部分
            html += `<div class="exam-section">
                <h2 class="section-title"><i class="fas fa-question-circle"></i> 三、判断题（每题2分，共20分）</h2>`;
            
            exam.judgments.forEach((q, i) => {
                html += `<div class="question-block">
                    <div class="question-number">${i+1}</div>
                    <p class="question-text">${q.question}</p>
                    <div class="true-false">
                        <div class="tf-option" data-type="judgment" data-qindex="${i}" data-option="true">正确</div>
                        <div class="tf-option" data-type="judgment" data-qindex="${i}" data-option="false">错误</div>
                    </div>
                    <div class="answer-area">
                        <p class="answer-text">正确答案：${q.answer ? '正确' : '错误'}</p>
                        <p class="explanation">解析：${q.explanation}</p>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            
            // 控制按钮
            html += `<div class="controls">
                <button class="control-btn submit-btn" id="submit-exam"><i class="fas fa-paper-plane"></i> 提交试卷</button>
                <button class="control-btn reset-btn" id="reset-exam"><i class="fas fa-redo"></i> 重新答题</button>
                <button class="control-btn answer-btn" id="show-answers"><i class="fas fa-eye"></i> 显示答案</button>
            </div>
            
            <div class="score-container hidden" id="score-container">
                <h2 class="score-title">您的成绩</h2>
                <div class="score-value" id="score-value">0</div>
                <p class="score-details" id="score-details"></p>
            </div>`;
            
            document.getElementById('exam-content').innerHTML = html;
            
            // 添加事件监听器
            addEventListeners();
        }
        
        // 添加事件监听器
        function addEventListeners() {
            // 选择题选项点击
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    const qindex = this.dataset.qindex;
                    const options = this.parentElement.querySelectorAll('.option');
                    
                    // 移除同问题的其他选中状态
                    options.forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // 设置当前选中状态
                    this.classList.add('selected');
                });
            });
            
            // 判断题选项点击
            document.querySelectorAll('.tf-option').forEach(option => {
                option.addEventListener('click', function() {
                    const qindex = this.dataset.qindex;
                    const options = this.parentElement.querySelectorAll('.tf-option');
                    
                    // 移除同问题的其他选中状态
                    options.forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // 设置当前选中状态
                    this.classList.add('selected');
                });
            });
            
            // 提交试卷
            document.getElementById('submit-exam').addEventListener('click', calculateScore);
            
            // 重新答题
            document.getElementById('reset-exam').addEventListener('click', resetExam);
            
            // 显示答案
            document.getElementById('show-answers').addEventListener('click', showAnswers);
        }
        
        // 计算分数
        function calculateScore() {
            const exam = exams[currentExam];
            let score = 0;
            let correctCount = 0;
            let totalCount = 0;
            
            // 选择题评分
            document.querySelectorAll('.option.selected').forEach(option => {
                const qindex = option.dataset.qindex;
                const selectedOption = option.dataset.option;
                
                if (parseInt(selectedOption) === exam.choices[qindex].answer) {
                    correctCount++;
                    option.style.backgroundColor = '#d4edda';
                } else {
                    option.style.backgroundColor = '#f8d7da';
                }
                totalCount++;
            });
            
            // 填空题评分
            document.querySelectorAll('.fill-input').forEach(input => {
                const qindex = input.dataset.qindex;
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = exam.fills[qindex].answer.toLowerCase();
                
                if (userAnswer === correctAnswer) {
                    correctCount++;
                    input.style.backgroundColor = '#d4edda';
                } else {
                    input.style.backgroundColor = '#f8d7da';
                }
                totalCount++;
            });
            
            // 判断题评分
            document.querySelectorAll('.tf-option.selected').forEach(option => {
                const qindex = option.dataset.qindex;
                const userAnswer = option.dataset.option === 'true';
                const correctAnswer = exam.judgments[qindex].answer;
                
                if (userAnswer === correctAnswer) {
                    correctCount++;
                    option.style.backgroundColor = '#d4edda';
                } else {
                    option.style.backgroundColor = '#f8d7da';
                }
                totalCount++;
            });
            
            // 计算分数
            const choicePoints = 2; // 每题2分
            const fillPoints = 1;   // 每空1分
            const judgmentPoints = 2; // 每题2分
            
            const choiceScore = correctCount - 
                (document.querySelectorAll('.fill-input').length + 
                 document.querySelectorAll('.tf-option.selected').length);
            
            const fillScore = correctCount - 
                (document.querySelectorAll('.option.selected').length + 
                 document.querySelectorAll('.tf-option.selected').length);
            
            const judgmentScore = correctCount - 
                (document.querySelectorAll('.option.selected').length + 
                 document.querySelectorAll('.fill-input').length);
            
            score = (choiceScore * choicePoints) + 
                    (fillScore * fillPoints) + 
                    (judgmentScore * judgmentPoints);
            
            // 显示成绩
            document.getElementById('score-value').textContent = score;
            document.getElementById('score-details').textContent = 
                `答对 ${correctCount} 题，总分 ${totalCount * 2} 分`;
            document.getElementById('score-container').classList.remove('hidden');
            
            // 滚动到成绩区域
            document.getElementById('score-container').scrollIntoView({ behavior: 'smooth' });
        }
        
        // 重置试卷
        function resetExam() {
            // 重置选择题
            document.querySelectorAll('.option.selected').forEach(option => {
                option.classList.remove('selected');
                option.style.backgroundColor = '';
            });
            
            // 重置填空题
            document.querySelectorAll('.fill-input').forEach(input => {
                input.value = '';
                input.style.backgroundColor = '';
            });
            
            // 重置判断题
            document.querySelectorAll('.tf-option.selected').forEach(option => {
                option.classList.remove('selected');
                option.style.backgroundColor = '';
            });
            
            // 隐藏成绩
            document.getElementById('score-container').classList.add('hidden');
            
            // 隐藏答案
            document.querySelectorAll('.answer-area').forEach(area => {
                area.style.display = 'none';
            });
        }
        
        // 显示答案
        function showAnswers() {
            document.querySelectorAll('.answer-area').forEach(area => {
                area.style.display = 'block';
            });
        }
    </script>
