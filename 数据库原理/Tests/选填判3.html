<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库原理期末测试卷 - 关系代数专项</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f0f5ff 0%, #e6f0ff 100%);
            color: #2c3e50;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #1a2980, #26d0ce);
            color: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }
        
        .exam-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        
        .exam-btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(106, 17, 203, 0.35);
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }
        
        .exam-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(106, 17, 203, 0.45);
        }
        
        .exam-btn.active {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            box-shadow: 0 6px 12px rgba(255, 65, 108, 0.4);
        }
        
        .exam-btn::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20px;
            height: 200%;
            background: rgba(255,255,255,0.3);
            transform: rotate(25deg);
            transition: all 0.7s;
        }
        
        .exam-btn:hover::after {
            left: 120%;
        }
        
        .exam-section {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            padding: 35px;
            margin-bottom: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .exam-section:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }
        
        .section-title {
            display: flex;
            align-items: center;
            font-size: 1.9rem;
            color: #1a2980;
            margin-bottom: 30px;
            padding-bottom: 18px;
            border-bottom: 3px solid #e0e6ed;
            position: relative;
        }
        
        .section-title i {
            margin-right: 15px;
            color: #2575fc;
            background: linear-gradient(135deg, #e0eaff 0%, #d6e4ff 100%);
            padding: 12px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(37, 117, 252, 0.2);
        }
        
        .section-title::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            border-radius: 3px;
        }
        
        .question-block {
            background: #f8faff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 5px solid #6a11cb;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .question-block:hover {
            background: #f0f5ff;
            box-shadow: 0 6px 15px rgba(106, 17, 203, 0.1);
        }
        
        .question-text {
            font-size: 1.15rem;
            margin-bottom: 18px;
            font-weight: 500;
            line-height: 1.7;
            color: #1a2980;
        }
        
        .question-number {
            position: absolute;
            top: -15px;
            left: -15px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(106, 17, 203, 0.3);
            font-size: 1.1rem;
        }
        
        .options {
            display: grid;
            gap: 12px;
        }
        
        .option {
            padding: 15px 20px;
            background: white;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.05rem;
        }
        
        .option:hover {
            border-color: #6a11cb;
            background: #e6eeff;
            transform: translateX(5px);
        }
        
        .option.selected {
            background: #dbe5ff;
            border-color: #2575fc;
            font-weight: 500;
            box-shadow: 0 4px 8px rgba(37, 117, 252, 0.15);
        }
        
        .fill-blank {
            display: inline-block;
            margin: 0 8px;
        }
        
        .fill-input {
            padding: 10px 15px;
            border: 2px solid #d0d8e8;
            border-radius: 8px;
            min-width: 150px;
            font-size: 1.05rem;
            background: white;
            transition: all 0.3s;
        }
        
        .fill-input:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 4px rgba(106, 17, 203, 0.15);
        }
        
        .true-false {
            display: flex;
            gap: 20px;
        }
        
        .tf-option {
            flex: 1;
            text-align: center;
            padding: 18px;
            background: white;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 1.1rem;
        }
        
        .tf-option:hover {
            border-color: #6a11cb;
            background: #e6eeff;
            transform: scale(1.03);
        }
        
        .tf-option.selected {
            background: #dbe5ff;
            border-color: #2575fc;
            box-shadow: 0 6px 12px rgba(37, 117, 252, 0.15);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 16px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.15rem;
            cursor: pointer;
            transition: all 0.4s;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            color: white;
        }
        
        .submit-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 176, 155, 0.4);
        }
        
        .reset-btn {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
        }
        
        .reset-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
        }
        
        .answer-btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }
        
        .answer-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(106, 17, 203, 0.4);
        }
        
        .answer-area {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #e0eaff 0%, #d6e4ff 100%);
            border-radius: 12px;
            display: none;
            border: 2px solid #c0d0ff;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .answer-text {
            font-weight: 700;
            color: #1a2980;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        
        .explanation {
            margin-top: 12px;
            color: #2c3e50;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        
        .score-container {
            text-align: center;
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #1a2980 0%, #26d0ce 100%);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            color: white;
            display: none;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .score-title {
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .score-value {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 25px 0;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #ffeb3b 0%, #ff9800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        
        .score-details {
            font-size: 1.25rem;
            margin-top: 15px;
            opacity: 0.9;
        }
        
        .relation-algebra {
            background: #fff8e1;
            border: 2px solid #ffd54f;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
        }
        
        .relation-algebra .symbol {
            color: #d32f2f;
            font-weight: bold;
        }
        
        .relation-algebra .attribute {
            color: #1976d2;
            font-weight: bold;
        }
        
        .relation-algebra .relation {
            color: #388e3c;
            font-weight: bold;
            font-style: italic;
        }
        
        .relation-algebra .condition {
            color: #7b1fa2;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .section-title {
                font-size: 1.6rem;
            }
            
            .control-btn {
                padding: 14px 25px;
                font-size: 1rem;
            }
            
            .true-false {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .exam-btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>数据库原理期末测试卷</h1>
            <p class="subtitle">关系代数专项测试</p>
        </header>
        
        <div class="exam-controls">
            <button class="exam-btn active" data-exam="1">试卷一</button>
            <button class="exam-btn" data-exam="2">试卷二</button>
            <button class="exam-btn" data-exam="3">试卷三</button>
        </div>
        
        <div id="exam-content">
            <!-- 试卷内容将通过JavaScript动态生成 -->
        </div>
    </div>

    <script>
        // 试卷数据
        const exams = {
            1: {
                choices: [
                    {
                        question: "关系代数中的选择操作对应SQL中的什么子句？",
                        options: ["SELECT", "FROM", "WHERE", "GROUP BY"],
                        answer: 2,
                        explanation: "选择操作（σ）在SQL中对应WHERE子句，用于筛选满足条件的元组。"
                    },
                    {
                        question: "在关系代数中，自然连接操作会如何处理同名属性？",
                        options: ["保留两个属性", "自动去重", "自动重命名", "只保留一个属性"],
                        answer: 3,
                        explanation: "自然连接会自动比较两个关系中所有同名的属性，并在结果中只保留一个副本。"
                    },
                    {
                        question: "以下哪个关系代数操作是二元的？",
                        options: ["投影", "选择", "更名", "自然连接"],
                        answer: 3,
                        explanation: "自然连接需要两个关系作为输入，因此是二元操作。"
                    },
                    {
                        question: "关系代数表达式 π_{姓名, 年龄}(σ_{专业='计算机'}(学生)) 表示什么？",
                        options: [
                            "查询计算机专业学生的所有信息",
                            "查询所有学生的姓名和年龄",
                            "查询计算机专业学生的姓名和年龄",
                            "查询计算机专业学生的姓名"
                        ],
                        answer: 2,
                        explanation: "该表达式先选择专业为计算机的学生，然后投影姓名和年龄属性。"
                    },
                    {
                        question: "在关系模型中，主码的作用是什么？",
                        options: [
                            "标识关系中的属性",
                            "唯一标识关系中的元组",
                            "建立表之间的关联",
                            "定义完整性约束"
                        ],
                        answer: 1,
                        explanation: "主码用于唯一标识关系中的每个元组，确保实体完整性。"
                    },
                    {
                        question: "关系代数中的投影操作对应SQL中的什么子句？",
                        options: ["SELECT", "FROM", "WHERE", "GROUP BY"],
                        answer: 0,
                        explanation: "投影操作（π）在SQL中对应SELECT子句，用于选择需要的属性列。"
                    },
                    {
                        question: "以下哪个不是基本的关系代数操作？",
                        options: ["选择", "投影", "笛卡尔积", "自然连接"],
                        answer: 3,
                        explanation: "自然连接是派生操作，可以用选择和笛卡尔积来定义。"
                    },
                    {
                        question: "关系代数表达式 R ÷ S 表示什么操作？",
                        options: [
                            "选择",
                            "除法",
                            "连接",
                            "差集"
                        ],
                        answer: 1,
                        explanation: "除法操作用于查询满足特定条件的所有元组，例如'查询选修了所有课程的学生'。"
                    },
                    {
                        question: "在关系代数中，外连接操作不包括以下哪种？",
                        options: ["左外连接", "右外连接", "全外连接", "内连接"],
                        answer: 3,
                        explanation: "内连接是基本连接操作，外连接包括左外连接、右外连接和全外连接。"
                    },
                    {
                        question: "关系代数操作的结果是什么？",
                        options: [
                            "一个数值",
                            "一个新的关系",
                            "一个布尔值",
                            "一个元组"
                        ],
                        answer: 1,
                        explanation: "关系代数操作的结果总是另一个关系，满足闭包性质。"
                    }
                ],
                fills: [
                    { 
                        question: "关系代数中，选择操作的符号是", 
                        answer: "σ",
                        explanation: "选择操作使用希腊字母sigma(σ)表示，后面跟选择条件。"
                    },
                    { 
                        question: "投影操作的符号是", 
                        answer: "π",
                        explanation: "投影操作使用希腊字母pi(π)表示，后面跟属性列表。"
                    },
                    { 
                        question: "自然连接的符号是", 
                        answer: "⋈",
                        explanation: "自然连接使用⋈符号表示，它会自动匹配相同属性名的属性。"
                    },
                    { 
                        question: "查询'计算机'专业学生的姓名和年龄的关系代数表达式是：π_{姓名,年龄}(_______(学生))",
                        answer: "σ_{专业='计算机'}",
                        explanation: "先使用选择操作筛选专业为计算机的学生，然后投影姓名和年龄属性。"
                    },
                    { 
                        question: "查询选修了'CS101'课程的学生的学号：π_{学号}(σ_{课程号='CS101'}(______))",
                        answer: "选课",
                        explanation: "在选课关系中选择课程号为CS101的元组，然后投影学号属性。"
                    },
                    { 
                        question: "关系代数表达式：学生 ⋈ 选课 表示什么操作？",
                        answer: "自然连接",
                        explanation: "⋈符号表示自然连接操作，它会自动匹配学生和选课关系中相同属性名的属性。"
                    },
                    { 
                        question: "查询没有选修任何课程的学生：π_{学号}(学生) - ________",
                        answer: "π_{学号}(选课)",
                        explanation: "使用差集操作，从所有学生中学号减去已选课学生的学号。"
                    },
                    { 
                        question: "关系R和S的并操作要求它们必须具有相同的______",
                        answer: "属性集",
                        explanation: "并操作要求两个关系具有相同的属性集（属性名和类型相同）。"
                    },
                    { 
                        question: "笛卡尔积操作的符号是",
                        answer: "×",
                        explanation: "笛卡尔积使用乘号(×)表示，将两个关系的所有元组进行组合。"
                    },
                    { 
                        question: "关系代数表达式 σ_{成绩>90}(选课) 表示什么？",
                        answer: "成绩大于90分的选课记录",
                        explanation: "选择操作σ用于筛选满足条件的元组，这里选择成绩大于90的选课记录。"
                    },
                    { 
                        question: "更名操作的符号是",
                        answer: "ρ",
                        explanation: "更名操作使用希腊字母rho(ρ)表示，用于更改关系名或属性名。"
                    },
                    { 
                        question: "查询所有课程都被选修的学生需要使用______操作",
                        answer: "除法",
                        explanation: "除法操作用于查询满足'所有'条件的情况，例如选修了所有课程的学生。"
                    },
                    { 
                        question: "关系代数表达式 π_{学号,姓名}(学生 ⋈ σ_{课程名='数据库'}(课程 ⋈ 选课)) 中，最外层的操作是______",
                        answer: "投影",
                        explanation: "最外层的π表示投影操作，选择学号和姓名属性。"
                    },
                    { 
                        question: "左外连接的符号是",
                        answer: "⟕",
                        explanation: "左外连接使用⟕符号表示，保留左侧关系的所有元组。"
                    },
                    { 
                        question: "关系代数中，交操作的符号是",
                        answer: "∩",
                        explanation: "交操作使用∩符号表示，返回两个关系中都存在的元组。"
                    }
                ],
                judgments: [
                    { 
                        question: "选择操作会改变关系的属性结构。", 
                        answer: false, 
                        explanation: "选择操作只改变元组数量（行），不改变属性结构（列）。" 
                    },
                    { 
                        question: "投影操作会消除重复的元组。", 
                        answer: true, 
                        explanation: "关系是集合，投影操作后会自动消除重复元组。" 
                    },
                    { 
                        question: "自然连接要求两个关系有相同的属性名。", 
                        answer: true, 
                        explanation: "自然连接会自动比较两个关系中所有同名的属性。" 
                    },
                    { 
                        question: "笛卡尔积操作要求两个关系没有同名属性。", 
                        answer: true, 
                        explanation: "如果存在同名属性，笛卡尔积操作无法进行，需要先使用更名操作。" 
                    },
                    { 
                        question: "关系代数中的除法操作可以用其他基本操作表示。", 
                        answer: true, 
                        explanation: "除法操作不是基本操作，可以用投影、笛卡尔积和差集等操作表示。" 
                    },
                    { 
                        question: "外连接操作会保留未匹配的元组。", 
                        answer: true, 
                        explanation: "外连接操作会保留至少一个关系中未匹配的元组，并用空值填充。" 
                    },
                    { 
                        question: "选择操作可以出现在投影操作之后。", 
                        answer: true, 
                        explanation: "关系代数操作可以组合使用，顺序取决于具体需求。" 
                    },
                    { 
                        question: "关系代数表达式 π_A(σ_B>10(R)) 等价于 σ_B>10(π_A(R))。", 
                        answer: false, 
                        explanation: "如果B不在投影属性A中，那么第二个表达式将无效。投影可能会删除B属性。" 
                    },
                    { 
                        question: "自然连接是等值连接的一种特殊情况。", 
                        answer: true, 
                        explanation: "自然连接是等值连接在相同属性名上的特例，且自动去除重复列。" 
                    },
                    { 
                        question: "关系代数支持聚合函数如SUM、AVG等。", 
                        answer: false, 
                        explanation: "基本关系代数不包含聚合函数，扩展的关系代数才支持分组和聚合。" 
                    }
                ]

                    <p class="question-text">${q.question}</p>
                    <div class="options">`;
                
                q.options.forEach((opt, j) => {
                    html += `<div class="option" data-type="choice" data-qindex="${i}" data-option="${j}">${String.fromCharCode(65+j)}. ${opt}</div>`;
                });
                
                html += `</div>
                    <div class="answer-area">
                        <p class="answer-text">正确答案：${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</p>
                        <p class="explanation">解析：${q.explanation}</p>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            
            // 填空题部分
            html += `<div class="exam-section">
                <h2 class="section-title"><i class="fas fa-edit"></i> 二、填空题（每空1分，共20分）</h2>`;
            
            exam.fills.forEach((q, i) => {
                html += `<div class="question-block">
                    <div class="question-number">${i+1}</div>
                    <p class="question-text">${q.question}</p>
                    <div class="answer-area">
                        <p class="answer-text">正确答案：${q.answer}</p>
                        <p class="explanation">解析：${q.explanation}</p>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            
            // 判断题部分
            html += `<div class="exam-section">
                <h2 class="section-title"><i class="fas fa-check-double"></i> 三、判断题（每题2分，共20分）</h2>`;
            
            exam.judgments.forEach((q, i) => {
                html += `<div class="question-block">
                    <div class="question-number">${i+1}</div>
                    <p class="question-text">${q.question}</p>
                    <div class="true-false">
                        <div class="tf-option" data-type="judgment" data-qindex="${i}" data-option="true">正确</div>
                        <div class="tf-option" data-type="judgment" data-qindex="${i}" data-option="false">错误</div>
                    </div>
                    <div class="answer-area">
                        <p class="answer-text">正确答案：${q.answer ? '正确' : '错误'}</p>
                        <p class="explanation">解析：${q.explanation}</p>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            
            // 控制按钮
            html += `<div class="controls">
                <button class="control-btn submit-btn" id="submit-exam"><i class="fas fa-paper-plane"></i> 提交试卷</button>
                <button class="control-btn reset-btn" id="reset-exam"><i class="fas fa-redo"></i> 重新答题</button>
                <button class="control-btn answer-btn" id="show-answers"><i class="fas fa-eye"></i> 显示答案</button>
            </div>
            
            <div class="score-container" id="score-container">
                <h2 class="score-title">您的成绩</h2>
                <div class="score-value" id="score-value">0</div>
                <p class="score-details" id="score-details"></p>
            </div>`;
            
            document.getElementById('exam-content').innerHTML = html;
            
            // 添加事件监听器
            addEventListeners();
        }
        
        // 添加事件监听器
        function addEventListeners() {
            // 选择题选项点击
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    const qindex = this.dataset.qindex;
                    const options = this.parentElement.querySelectorAll('.option');
                    
                    // 移除同问题的其他选中状态
                    options.forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // 设置当前选中状态
                    this.classList.add('selected');
                });
            });
            
            // 判断题选项点击
            document.querySelectorAll('.tf-option').forEach(option => {
                option.addEventListener('click', function() {
                    const qindex = this.dataset.qindex;
                    const options = this.parentElement.querySelectorAll('.tf-option');
                    
                    // 移除同问题的其他选中状态
                    options.forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // 设置当前选中状态
                    this.classList.add('selected');
                });
            });
            
            // 提交试卷
            document.getElementById('submit-exam').addEventListener('click', calculateScore);
            
            // 重新答题
            document.getElementById('reset-exam').addEventListener('click', resetExam);
            
            // 显示答案
            document.getElementById('show-answers').addEventListener('click', showAnswers);
        }
        
        // 计算分数
        function calculateScore() {
            const exam = exams[currentExam];
            let score = 0;
            let correctCount = 0;
            let totalCount = exam.choices.length + exam.fills.length + exam.judgments.length;
            
            // 选择题评分
            document.querySelectorAll('.option.selected').forEach(option => {
                const qindex = option.dataset.qindex;
                const selectedOption = option.dataset.option;
                
                if (parseInt(selectedOption) === exam.choices[qindex].answer) {
                    correctCount++;
                    option.style.backgroundColor = '#d4edda';
                } else {
                    option.style.backgroundColor = '#f8d7da';
                }
            });
            
            // 判断题评分
            document.querySelectorAll('.tf-option.selected').forEach(option => {
                const qindex = option.dataset.qindex;
                const userAnswer = option.dataset.option === 'true';
                const correctAnswer = exam.judgments[qindex].answer;
                
                if (userAnswer === correctAnswer) {
                    correctCount++;
                    option.style.backgroundColor = '#d4edda';
                } else {
                    option.style.backgroundColor = '#f8d7da';
                }
            });
            
            // 计算分数（选择题每题2分，判断题每题2分，填空题每题1分）
            score = (correctCount * 2) - exam.fills.length;
            
            // 显示成绩
            document.getElementById('score-value').textContent = score;
            document.getElementById('score-details').textContent = 
                `答对 ${correctCount} 题，总分 ${totalCount * 2} 分`;
            document.getElementById('score-container').style.display = 'block';
            
            // 显示所有答案
            showAnswers();
            
            // 滚动到成绩区域
            document.getElementById('score-container').scrollIntoView({ behavior: 'smooth' });
        }
        
        // 重置试卷
        function resetExam() {
            // 重置选择题
            document.querySelectorAll('.option.selected').forEach(option => {
                option.classList.remove('selected');
                option.style.backgroundColor = '';
            });
            
            // 重置判断题
            document.querySelectorAll('.tf-option.selected').forEach(option => {
                option.classList.remove('selected');
                option.style.backgroundColor = '';
            });
            
            // 隐藏成绩
            document.getElementById('score-container').style.display = 'none';
            
            // 隐藏答案
            document.querySelectorAll('.answer-area').forEach(area => {
                area.style.display = 'none';
            });
        }
        
        // 显示答案
        function showAnswers() {
            document.querySelectorAll('.answer-area').forEach(area => {
                area.style.display = 'block';
            });
        }
    </script>
</body>
</html>
